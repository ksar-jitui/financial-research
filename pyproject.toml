[project]
name = "annual-report-tone-audit"
version = "0.1.0"
description = "年报语调操纵审计 Agent — 多Agent协同的金融学术审计工具"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "streamlit>=1.30",
    "pymupdf>=1.24",
    "jieba>=0.42",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.2"]

[tool.ruff]
line-length = 100
target-version = "py310"
