[project]
name = "annual-report-tone-audit"
version = "0.1.0"
description = "年报语调操纵审计 Agent — 比对 MD&A 表述与财务基本面的背离，输出带证据链的风险预警"
requires-python = ">=3.10"
# 与 requirements.txt 同一份清单：只列两套运行时真正 import 的包。
dependencies = [
    "streamlit>=1.30",
    "pandas>=2.1",
    "akshare>=1.14.0",
    "requests>=2.31.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "jieba>=0.42",
    "plotly>=5.18",
    "openai>=1.50",
]

[tool.ruff]
line-length = 100
target-version = "py310"
